# .github/workflows/publish-from-raw.yml
name: Publish from IA RAW to FSPneu
run-name: "Publish: ${{ github.event.client_payload.line || inputs.line }}"

on:
  repository_dispatch:
    types: [publish_recording]
  workflow_dispatch:
    inputs:
      line:
        description: "Exact line identifier (must match RAW exactly)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-from-raw
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RAW_IA_IDENTIFIER: "FSPraw"
      TARGET_IA_IDENTIFIER: "FSPneu"
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
      LINE: ${{ github.event.client_payload.line || inputs.line }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Validate LINE
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${LINE}" ]; then
            echo "LINE is missing. Provide client_payload.line for repository_dispatch or inputs.line for workflow_dispatch."
            exit 2
          fi
          echo "Resolved LINE=${LINE}"

      - name: Publish or queue
        id: publish
        shell: bash
        run: |
          set -euo pipefail

          # Capture exit code while still tee'ing output.
          set +e
          python tools/publish_from_raw.py --line "${LINE}" | tee .publish_output.txt
          code="${PIPESTATUS[0]}"
          set -e

          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

          if [ "${code}" -eq 4 ]; then
            echo "RAW not yet available -> queueing request"
            python tools/enqueue_pending.py --line "${LINE}"
          elif [ "${code}" -ne 0 ]; then
            exit "${code}"
          fi

      - name: Summary
        if: ${{ always() && (steps.publish.outputs.exit_code == '0' || steps.publish.outputs.exit_code == '4') }}
        shell: bash
        run: |
          set -euo pipefail
          code="${{ steps.publish.outputs.exit_code }}"
          {
            echo "### Publish summary"
            echo ""
            echo "- LINE: \`${LINE}\`"
            if [ "${code}" = "0" ]; then
              echo "- Result: ✅ published"
            else
              echo "- Result: ⏳ queued (RAW not yet available)"
            fi
            echo ""
            echo "#### Script output (last 200 lines)"
            echo "\`\`\`"
            if [ -s .publish_output.txt ]; then
              tail -n 200 .publish_output.txt
            else
              echo "(no script output)"
            fi
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit queue changes (if any)
        if: ${{ steps.publish.outputs.exit_code == '4' }}
        shell: bash
        run: |
          set -euo pipefail

          # Only proceed if enqueue actually changed the repo.
          if git diff --quiet -- queue/pending.json 2>/dev/null; then
            echo "No queue changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add queue/pending.json
          git commit -m "chore: queue publish request"

          # Push with rebase retries; autostash prevents failure if the rebase needs a clean index.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}) -> pulling/rebasing and retrying..."
            git pull --rebase --autostash
          done

          echo "Failed to push after retries."
          exit 1
