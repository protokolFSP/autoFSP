# .github/workflows/publish-from-raw.yml
name: Publish from IA RAW to FSPneu
run-name: "Publish: ${{ github.event.client_payload.line || inputs.line }}"

on:
  repository_dispatch:
    types: [publish_recording]
  workflow_dispatch:
    inputs:
      line:
        description: "Exact line identifier (must match RAW exactly)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-from-raw
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RAW_IA_IDENTIFIER: "FSPraw"
      TARGET_IA_IDENTIFIER: "FSPneu"
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve LINE
        shell: bash
        run: |
          set -euo pipefail
          LINE="${{ github.event.client_payload.line || inputs.line }}"
          if [ -z "${LINE}" ]; then
            echo "LINE is missing. Provide client_payload.line for repository_dispatch or inputs.line for workflow_dispatch."
            exit 2
          fi
          echo "LINE=${LINE}" >> "$GITHUB_ENV"
          echo "Resolved LINE=${LINE}"

      - name: Publish or queue
        id: publish
        shell: bash
        run: |
          set +e
          python tools/publish_from_raw.py --line "${LINE}" | tee .publish_output.txt
          code="${PIPESTATUS[0]}"
          set -e

          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          echo "publish_exit_code=${code}"

          if [ "${code}" -eq 4 ]; then
            echo "RAW not yet available -> queueing request"
            python tools/enqueue_pending.py --line "${LINE}"
          elif [ "${code}" -ne 0 ]; then
            exit "${code}"
          fi

      - name: Upload publish output artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publish_output
          path: .publish_output.txt

      - name: Verify published file exists on FSPneu (metadata check)
        if: ${{ steps.publish.outputs.exit_code == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          python - << 'PY'
          import json, re, sys, time
          import requests

          ident = "FSPneu"

          txt = open(".publish_output.txt", "r", encoding="utf-8", errors="ignore").read()
          candidates = re.findall(r"\{.*\}", txt)
          final_name = None
          for c in reversed(candidates):
            try:
              obj = json.loads(c)
            except Exception:
              continue
            if isinstance(obj, dict) and obj.get("final_filename"):
              final_name = obj["final_filename"]
              break

          if not final_name:
            print("ERROR: Could not find final_filename in .publish_output.txt")
            sys.exit(1)

          url = f"https://archive.org/metadata/{ident}"

          for i in range(1, 7):
            meta = requests.get(url, timeout=30).json()
            files = meta.get("files", [])
            names = {f.get("name") for f in files if isinstance(f, dict)}
            if final_name in names:
              print("OK: File present on metadata:", final_name)
              sys.exit(0)
            print(f"Not listed yet (attempt {i}/6) -> sleeping 10s")
            time.sleep(10)

          print("ERROR: exit_code=0 but file not present on metadata after retries:", final_name)
          sys.exit(1)
          PY

      - name: Summary
        if: ${{ always() && (steps.publish.outputs.exit_code == '0' || steps.publish.outputs.exit_code == '4') }}
        shell: bash
        run: |
          set -euo pipefail
          code="${{ steps.publish.outputs.exit_code }}"
          {
            echo "### Publish summary"
            echo ""
            echo "- LINE: \`${LINE}\`"
            if [ "${code}" = "0" ]; then
              echo "- Result: ✅ published"
            else
              echo "- Result: ⏳ queued (RAW not yet available)"
            fi
            echo ""
            echo "#### Script output (last 200 lines)"
            echo "\`\`\`"
            if [ -s .publish_output.txt ]; then
              tail -n 200 .publish_output.txt
            else
              echo "(no script output)"
            fi
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit queue changes (if any)
        shell: bash
        run: |
          set -euo pipefail

          # Commit anything under queue/ (not only queue/pending.json)
          if git diff --quiet -- queue/; then
            echo "No queue changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add queue/
          git commit -m "chore: queue publish request"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}) -> pulling/rebasing and retrying..."
            git pull --rebase
          done

          echo "Failed to push after retries."
          exit 1
