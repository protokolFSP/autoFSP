name: Publish from IA RAW to FSPneu

on:
  repository_dispatch:
    types: [publish_recording]
  workflow_dispatch:
    inputs:
      line:
        description: "Exact line identifier (must match RAW exactly)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-from-raw
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      RAW_IA_IDENTIFIER: "FSPraw"
      TARGET_IA_IDENTIFIER: "FSPneu"
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Resolve LINE
        shell: bash
        run: |
          set -euo pipefail

          # Prefer repository_dispatch payload, fallback to workflow_dispatch input
          LINE_FROM_PAYLOAD='${{ github.event.client_payload.line }}'
          LINE_FROM_INPUT='${{ inputs.line }}'

          LINE="$LINE_FROM_PAYLOAD"
          if [ -z "${LINE}" ]; then
            LINE="$LINE_FROM_INPUT"
          fi

          if [ -z "${LINE}" ]; then
            echo "LINE is missing. Provide client_payload.line for repository_dispatch or inputs.line for workflow_dispatch."
            exit 2
          fi

          echo "LINE=${LINE}" >> "$GITHUB_ENV"
          echo "Resolved LINE=${LINE}"

      - name: Publish or queue
        shell: bash
        run: |
          set +e
          python tools/publish_from_raw.py --line "${LINE}"
          code=$?
          set -e

          if [ "$code" -eq 4 ]; then
            echo "RAW not yet available -> queueing request"
            python tools/enqueue_pending.py --line "${LINE}"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit queue changes (if any)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- queue/pending.json; then
            echo "No queue changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue/pending.json
          git commit -m "chore: queue publish request"
          git push
