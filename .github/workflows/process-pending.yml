# .github/workflows/process-pending.yml
name: Process pending publish queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest

    env:
      RAW_IA_IDENTIFIER: "FSPraw"
      TARGET_IA_IDENTIFIER: "FSPneu"
      IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
      IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Process queue
        id: process_queue
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python - <<'PY'
          """
          Processes queue/pending.json:
            - rc=0: remove item from queue
            - rc=4: keep waiting
            - else: keep item, but report hard error after persisting updated queue
          """
          from __future__ import annotations

          import json
          import os
          import subprocess
          import sys
          from dataclasses import dataclass
          from typing import Any, Dict, List, Optional


          PATH = "queue/pending.json"
          MAX_PER_RUN = int(os.environ.get("QUEUE_MAX_PER_RUN", "0"))  # 0 => no limit


          @dataclass
          class Result:
              published: int
              remaining: int
              first_hard_error: Optional[int]


          def load_queue(path: str) -> Dict[str, Any]:
              if not os.path.exists(path):
                  return {"pending": []}
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
              if not isinstance(data, dict):
                  return {"pending": []}
              pending = data.get("pending", [])
              if not isinstance(pending, list):
                  pending = []
              data["pending"] = pending
              return data


          def save_queue(path: str, data: Dict[str, Any]) -> None:
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2, sort_keys=True)
                  f.write("\n")


          def run_publish(line: str) -> int:
              print(f"[queue] processing line={line!r}", flush=True)
              p = subprocess.run(
                  [sys.executable, "tools/publish_from_raw.py", "--line", line],
                  capture_output=True,
                  text=True,
              )
              print(f"[queue] rc={p.returncode} line={line!r}", flush=True)
              if p.stdout:
                  print("[queue][stdout]")
                  print(p.stdout.rstrip())
              if p.stderr:
                  print("[queue][stderr]")
                  print(p.stderr.rstrip())
              return int(p.returncode)


          def process(data: Dict[str, Any]) -> Result:
              pending: List[Dict[str, Any]] = list(data.get("pending", []))
              if not pending:
                  print("queue empty")
                  return Result(published=0, remaining=0, first_hard_error=None)

              keep: List[Dict[str, Any]] = []
              published = 0
              first_hard_error: Optional[int] = None
              processed = 0

              for item in pending:
                  if MAX_PER_RUN and processed >= MAX_PER_RUN:
                      keep.append(item)
                      continue

                  if not isinstance(item, dict):
                      continue

                  line = str(item.get("line", "")).strip()
                  if not line:
                      continue

                  rc = run_publish(line)
                  processed += 1

                  if rc == 0:
                      published += 1
                      continue

                  if rc == 4:
                      keep.append(item)
                      continue

                  keep.append(item)
                  if first_hard_error is None:
                      first_hard_error = rc

              data["pending"] = keep
              print(
                  f"published={published} remaining={len(keep)} "
                  f"processed={processed} hard_error={first_hard_error}"
              )
              return Result(
                  published=published,
                  remaining=len(keep),
                  first_hard_error=first_hard_error,
              )


          def main() -> int:
              data = load_queue(PATH)
              res = process(data)
              save_queue(PATH, data)
              return res.first_hard_error or 0


          raise SystemExit(main())
          PY
          code=$?
          set -e

          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit queue updates (if changed)
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- queue/pending.json 2>/dev/null; then
            echo "No queue updates."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add queue/pending.json
          git commit -m "chore: process publish queue"

          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push failed (attempt ${attempt}) -> fetching/rebasing and retrying..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
          done

          echo "Failed to push after retries."
          exit 1

      - name: Fail on hard publish error
        if: ${{ always() && steps.process_queue.outputs.exit_code != '0' }}
        shell: bash
        run: |
          echo "Queue processing had hard error: ${{ steps.process_queue.outputs.exit_code }}"
          exit 1
